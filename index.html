<style>
/* Layout: barra fija con buscador y abecedario; índice de patologías a la izquierda; fichas de fórmulas en columnas a la derecha */
:root{
  --paper:#f5f7f6; --sheet:#ffffff; --ink:#15231f; --muted:#5a6b66; --rule:#d8e1de;
  --accent:#0d6655; --accent-soft:#e2efeb; --mark:#ffe7a0; --mark-ink:#2a2105;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --bar-h:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1715; --sheet:#16211e; --ink:#e3ece9; --muted:#93a59f; --rule:#2a3834;
  --accent:#5cc4ad; --accent-soft:#1c2f2a; --mark:#5a4a12; --mark-ink:#fff3cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1715; --sheet:#16211e; --ink:#e3ece9; --muted:#93a59f; --rule:#2a3834;
  --accent:#5cc4ad; --accent-soft:#1c2f2a; --mark:#5a4a12; --mark-ink:#fff3cc; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--rule);padding-inline:16px}
.bar-in{max-width:1280px;margin:0 auto;padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.rx{font-family:var(--f-display);font-weight:600;font-size:26px;color:var(--accent);line-height:1}
h1{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;line-height:1.15;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:0 10px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:9px 0;outline:none}
.search button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:4px}
.az{display:flex;flex-wrap:wrap;gap:2px}
.az a{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 4px;border-radius:6px;text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--accent)}
.az a:hover{background:var(--accent-soft)}
.az a.off{color:var(--rule);pointer-events:none}
.az a.cur{background:var(--accent);color:var(--sheet)}

.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px}
.side{position:sticky;top:calc(var(--bar-h) + 12px);align-self:start;max-height:calc(100vh - var(--bar-h) - 24px);overflow:auto;padding-right:6px}
.side h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.idx-l{font-family:var(--f-display);font-weight:600;color:var(--accent);font-size:15px;margin:12px 0 2px}
.idx a{display:block;text-decoration:none;font-size:13px;padding:3px 8px;border-radius:5px;color:var(--ink)}
.idx a:hover{background:var(--accent-soft)}
.idx a .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;margin-left:4px}
.side-toggle{display:none}

.letter{scroll-margin-top:calc(var(--bar-h) + 8px)}
.letter + .letter{margin-top:40px}
.lhead{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:6px}
.lhead .big{font-family:var(--f-display);font-weight:600;font-size:64px;line-height:.85;color:var(--accent)}
.lhead .pl{display:flex;flex-wrap:wrap;gap:4px 6px;padding-bottom:4px;min-width:0}
.lhead .pl a{font-size:12px;text-decoration:none;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 9px;background:var(--sheet)}
.lhead .pl a:hover{color:var(--accent);border-color:var(--accent)}

.pat{scroll-margin-top:calc(var(--bar-h) + 8px);padding-top:22px}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:12px}
.phead h3{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
.phead .c{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cards{columns:3 270px;column-gap:14px}
.card{break-inside:avoid;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px 10px;margin-bottom:14px;position:relative}
.card .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--accent);margin:2px 0 4px}
.card .ln{margin:0;font-size:14px;overflow-wrap:anywhere}
.card .ing{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--rule);padding:2px 0}
.card .ing .d{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.card .veh{color:var(--muted);font-style:italic;padding-top:3px}
.card .use{font-size:13px;color:var(--muted);border-left:2px solid var(--accent);padding-left:8px;margin-top:6px}
.card .gap{height:6px}
.copy{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:5px;opacity:.55}
.card:hover .copy,.copy:focus-visible{opacity:1}
.copy:hover{background:var(--accent-soft);color:var(--accent)}
.card.has-copy .first{padding-right:22px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}
.empty{padding:40px 0;color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px}
.note{color:var(--muted);font-size:12px;margin-top:18px;border-top:1px solid var(--rule);padding-top:10px}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:8px}
  .side{position:static;max-height:none;overflow:visible;padding:0}
  .side-toggle{display:block;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;font-weight:600;border-radius:8px;padding:8px 12px;width:100%;text-align:left;cursor:pointer}
  .side .idx-box[hidden]{display:none!important}
  .side .idx-box{margin-top:8px;max-height:60vh;overflow:auto;border:1px solid var(--rule);border-radius:8px;padding:8px;background:var(--sheet)}
  .side h2{display:none}
  .lhead .big{font-size:48px}
  .phead h3{font-size:21px}
  h1{font-size:18px}
  .az a{min-width:26px;height:28px;font-size:15px}
}
</style>

</head>

</div>

const ALPHA = DATA.letters.map(l => l.letter);
const $ = s => document.querySelector(s);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = (l, n) => 'p-' + norm(l + '-' + n).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function hl(text, q) {
  const e = esc(text);
  if (!q) return e;
  const nt = norm(text);
  let out = '', i = 0, k;
  // el texto normalizado conserva la longitud en caracteres latinos habituales
  if (nt.length !== text.length) return e;
  while ((k = nt.indexOf(q, i)) !== -1) { out += esc(text.slice(i, k)) + '<mark>' + esc(text.slice(k, k + q.length)) + '</mark>'; i = k + q.length; }
  return out + esc(text.slice(i));
}

const RE_USE = /^(modo de (aplicaci[oó]n|empleo|uso)|posolog[ií]a|aplicaci[oó]n|aplicar|se aplica|uso:|tomar|indicaciones?:)/i;
const RE_VEH = /(c\.?\s?s\.?\s?p\.?|\bcsp\b|\bexc(ipiente|\.)?\b|para 1 c[aá]ps|\bn[ºo°]\s*\d+|\bq\.?s\.?\b)/i;
const RE_DOSE = /^(.+?)\s*[.…·_]{0,}\s*((?:aa\.?\s*)?\d[\d.,]*(?:\s*[-–]\s*\d[\d.,]*)?\s*(?:%|mg\/kg\/d[ií]a|mg|g|ml|mL|μg|µg|mcg|UI|U\.?I\.?|gotas?)\.?)\s*$/i;
const isHead = l => { const letters = l.replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g, ''); if (letters.length < 4 || l.length > 70) return false; const up = letters.replace(/[^A-ZÁÉÍÓÚÜÑ]/g, '').length; return up / letters.length > 0.85 && !RE_DOSE.test(l); };

function renderLine(l, q, first) {
  if (l === '') return '<div class="gap"></div>';
  const f = first ? ' first' : '';
  if (isHead(l)) return `<p class="ln lbl${f}">${hl(l, q)}</p>`;
  if (RE_USE.test(l)) return `<p class="ln use${f}">${hl(l, q)}</p>`;
  const m = l.match(RE_DOSE);
  if (m && !RE_VEH.test(m[1]) && m[1].length < 70) return `<p class="ln ing${f}"><span>${hl(m[1].replace(/[\s.…·_]+$/, ''), q)}</span><span class="d">${hl(m[2], q)}</span></p>`;
  if (RE_VEH.test(l)) return `<p class="ln veh${f}">${hl(l, q)}</p>`;
  return `<p class="ln${f}">${hl(l, q)}</p>`;
}

const BLOCKS = [];
function renderCard(lines, q) {
  const id = BLOCKS.push(lines) - 1;
  return `<div class="card has-copy"><button class="copy" type="button" data-b="${id}" aria-label="Copiar fórmula" title="Copiar fórmula"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg></button>${lines.map((l, i) => renderLine(l, q, i === 0)).join('')}</div>`;
}

function render() {
  const q = norm($('#q').value.trim());
  $('#clear').hidden = !q;
  BLOCKS.length = 0;
  let html = '', idx = '', nPat = 0, nForm = 0;
  const present = new Set();
  for (const L of DATA.letters) {
    let body = '', chips = '', lIdx = '';
    for (const p of L.items) {
      const nameHit = !q || norm(p.name).includes(q);
      const blocks = nameHit ? p.blocks : p.blocks.filter(b => norm(b.join(' ')).includes(q));
      if (q && !nameHit && !blocks.length) continue;
      const id = slug(L.letter, p.name);
      nPat++; nForm += blocks.length;
      chips += `<a href="#${id}">${esc(p.name)}</a>`;
      lIdx += `<a href="#${id}">${hl(p.name, nameHit ? q : '')}<span class="n">${blocks.length}</span></a>`;
      body += `<section class="pat" id="${id}"><div class="phead"><h3>${hl(p.name, q)}</h3><span class="c">${blocks.length} ${blocks.length === 1 ? 'fórmula' : 'fórmulas'}${q && !nameHit ? ' con «' + esc($('#q').value.trim()) + '»' : ''}</span></div>` +
        (blocks.length ? `<div class="cards">${blocks.map(b => renderCard(b, q)).join('')}</div>` : '<p class="empty">Esta página está vacía en el cuaderno original o solo contiene imágenes.</p>') + '</section>';
    }
    if (!body) continue;
    present.add(L.letter);
    html += `<section class="letter" id="l-${L.letter}"><div class="lhead"><span class="big">${L.letter}</span><nav class="pl" aria-label="Patologías de la ${L.letter}">${chips}</nav></div>${body}</section>`;
    idx += `<div class="idx-l"><a href="#l-${L.letter}" style="padding:0;display:inline">${L.letter}</a></div>${lIdx}`;
  }
  $('#main').innerHTML = html || `<p class="empty">No hay ninguna patología ni fórmula que contenga «${esc($('#q').value.trim())}». Prueba con otra palabra o con el nombre del principio activo sin dosis.</p>`;
  $('#main').insertAdjacentHTML('beforeend', '<p class="note">Transcrito del cuaderno OneNote «FORMULACIÓN MAGISTRAL». Revise dosis y excipientes contra la fuente original antes de elaborar o prescribir.</p>');
  $('#idx').innerHTML = idx;
  $('#az').innerHTML = ALPHA.map(a => `<a href="#l-${a}" class="${present.has(a) ? '' : 'off'}">${a}</a>`).join('');
  $('#m-pat').textContent = nPat; $('#m-form').textContent = nForm;
}

let t;
$('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { render(); window.scrollTo({top: 0}); }, 140); });
$('#clear').addEventListener('click', () => { $('#q').value = ''; render(); $('#q').focus(); });

function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; d.setAttribute('role', 'status'); document.body.appendChild(d); setTimeout(() => d.remove(), 1600); }
document.addEventListener('click', e => {
  const b = e.target.closest('.copy');
  if (!b) return;
  const text = BLOCKS[+b.dataset.b].join('\n');
  const card = b.closest('.card');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(card); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Fórmula seleccionada: pulse Ctrl+C para copiarla'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Fórmula copiada'), fallback); } catch (_) { fallback(); }
});

const st = $('#side-toggle'), box = $('#idx-box');
const mq = matchMedia('(max-width:860px)');
const syncSide = () => { if (mq.matches) { box.hidden = st.getAttribute('aria-expanded') !== 'true'; } else { box.hidden = false; } };
st.addEventListener('click', () => { st.setAttribute('aria-expanded', st.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); syncSide(); });
box.addEventListener('click', e => { if (mq.matches && e.target.closest('a')) { st.setAttribute('aria-expanded', 'false'); syncSide(); } });
mq.addEventListener('change', syncSide);

const setBar = () => document.documentElement.style.setProperty('--bar-h', $('#bar').offsetHeight + 'px');
new ResizeObserver(setBar).observe($('#bar'));

const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { const l = e.target.id.slice(2); document.querySelectorAll('#az a').forEach(a => a.classList.toggle('cur', a.textContent === l)); } }, {rootMargin: '-30% 0px -65% 0px'});
const observe = () => { io.disconnect(); document.querySelectorAll('.letter').forEach(s => io.observe(s)); };
render(); syncSide(); setBar(); observe();
$('#q').addEventListener('input', () => setTimeout(observe, 200));
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
